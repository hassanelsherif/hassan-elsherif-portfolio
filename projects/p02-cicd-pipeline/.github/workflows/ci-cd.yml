name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "projects/p02-cicd-pipeline/**"
  pull_request:
    branches: [main]
    paths:
      - "projects/p02-cicd-pipeline/**"

# Least-privilege default permissions
permissions:
  contents: read

jobs:
  # ── Gate 1: Lint + Unit Tests ───────────────────────────────────────────────
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/p02-cicd-pipeline/app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/p02-cicd-pipeline/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true   # lint warnings don't block; errors do

      - name: Unit tests
        run: npm test

  # ── Gate 2: Docker build + Trivy scan ──────────────────────────────────────
  build-scan:
    name: Build & Scan
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: projects/p02-cicd-pipeline/app
          push: false
          load: true
          tags: p02-app:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: p02-app:scan
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

  # ── Gate 3: Push to GHCR (main branch only) ────────────────────────────────
  push-image:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: build-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/p02-app
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: projects/p02-cicd-pipeline/app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Gate 4: Deploy (simulated locally via Docker) ──────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and run image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/p02-app:latest"
          docker pull "$IMAGE"
          docker stop p02-app 2>/dev/null || true
          docker rm   p02-app 2>/dev/null || true
          docker run -d --name p02-app -p 3001:3001 \
            -e APP_VERSION="${{ github.sha }}" \
            "$IMAGE"

      - name: Health check
        run: |
          sleep 5
          curl --fail --retry 3 --retry-delay 3 http://localhost:3001/health

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deploy failed — rolling back"
          docker stop p02-app 2>/dev/null || true
          docker rm   p02-app 2>/dev/null || true
          # In a real environment: pull previous SHA-tagged image and redeploy
